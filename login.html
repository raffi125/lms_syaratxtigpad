<!DOCTYPE html>
<html lang="id" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Portal - KOLAB SYARAT X TIGPAD LMS</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- DaisyUI & Tailwind CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        syarat: {
                            DEFAULT: '#163C8A',
                            light: '#2557c4',
                            dark: '#0d265c',
                        },
                        tigpad: {
                            DEFAULT: '#F97316',
                            light: '#fb923c',
                            dark: '#c2410c',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen relative flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8 selection:bg-tigpad selection:text-white">

    <!-- Ambient Glowing Background Orbs -->
    <div class="orb-container">
        <div class="orb orb-blue"></div>
        <div class="orb orb-orange"></div>
        <div class="orb orb-purple"></div>
    </div>

    <!-- Top Navigation Bar for Mobile & Desktop -->
    <div class="w-full max-w-md sm:max-w-none sm:fixed sm:top-5 sm:left-0 sm:right-0 sm:px-6 z-50 flex items-center justify-between mb-4 sm:mb-0">
        <a href="index.html" class="glass-card px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-2xl text-xs font-bold flex items-center gap-2 hover:border-tigpad hover:text-tigpad transition-all shadow-md">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Beranda</span>
        </a>

        <button onclick="toggleDarkMode()" aria-label="Ubah Tema Display" class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl glass-card flex items-center justify-center text-slate-700 dark:text-slate-200 hover:text-amber-500 transition-colors shadow-md">
            <i id="themeIcon" class="fa-solid fa-moon text-sm sm:text-base"></i>
        </button>
    </div>

    <!-- Main Login Container Card -->
    <main class="w-full max-w-md relative z-10 space-y-5 sm:space-y-6 my-auto">

        
        <!-- Header Branding -->
        <div class="text-center space-y-3">
            <a href="index.html" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-syarat to-tigpad text-white text-2xl font-bold shadow-xl shadow-syarat/30 hover:scale-105 transition-transform">
                <i class="fa-solid fa-hands-asl-interpreting"></i>
            </a>
            <div>
                <h1 class="text-2xl font-black tracking-tight bg-gradient-to-r from-syarat via-blue-600 to-tigpad bg-clip-text text-transparent">SYARAT X TIGPAD</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Platform Edukasi & Kolaborasi BISINDO</p>
            </div>
        </div>

        <!-- Glassmorphism Form Card -->
        <div class="glass-card p-6 sm:p-8 rounded-3xl space-y-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            
            <!-- Multi-Role Tab Switcher -->
            <div class="space-y-2">
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider text-center">Pilih Peran Login Akun</label>
                <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-200/80 dark:bg-slate-900/80 rounded-2xl border border-slate-300/80 dark:border-slate-800">
                    <button type="button" onclick="selectRole('peserta')" id="tabRole_peserta" class="py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-gradient-to-r from-syarat to-tigpad text-white shadow-md">
                        <i class="fa-solid fa-user-graduate"></i>
                        <span>Peserta</span>
                    </button>
                    <button type="button" onclick="selectRole('mentor')" id="tabRole_mentor" class="py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>Mentor</span>
                    </button>
                    <button type="button" onclick="selectRole('admin')" id="tabRole_admin" class="py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i class="fa-solid fa-user-shield"></i>
                        <span>Admin</span>
                    </button>
                </div>
            </div>

            <!-- SSO Info Badge Dynamic -->
            <div id="roleInfoBadge" class="p-3.5 rounded-2xl bg-syarat/10 border border-syarat/20 text-xs flex items-center gap-3">
                <div class="w-8 h-8 rounded-xl bg-syarat text-white flex items-center justify-center font-bold text-sm flex-shrink-0" id="roleBadgeIcon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <div id="roleBadgeTitle" class="font-bold text-syarat dark:text-syarat-light">Akses Login Peserta Umum</div>
                    <div id="roleBadgeDesc" class="text-[10px] text-slate-500 dark:text-slate-400">Gunakan akun email Anda untuk masuk.</div>
                </div>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
                
                <!-- Email SSO Input -->
                <div class="space-y-1.5">
                    <label class="block font-bold text-slate-700 dark:text-slate-300">Email Akun Terdaftar</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="loginEmail" required placeholder="nama.peserta@email.com" value="rina.rahmawati@email.com" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 font-medium focus:ring-2 focus:ring-tigpad outline-none transition-all">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="block font-bold text-slate-700 dark:text-slate-300">Kata Sandi Akun</label>
                        <a href="javascript:void(0)" onclick="showInfoModal({ title: 'Pemulihan Kata Sandi', message: 'Silakan hubungi Administrator Sistem / Helpdesk Layanan untuk permohonan reset sandi akun Anda.', type: 'info' })" class="text-[11px] text-tigpad font-semibold hover:underline">Lupa Sandi?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="loginPassword" required placeholder="••••••••" value="kolab2026" class="w-full pl-10 pr-10 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 font-medium focus:ring-2 focus:ring-tigpad outline-none transition-all">
                        <button type="button" onclick="togglePasswordVisibility()" aria-label="Lihat Password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="checkbox checkbox-xs checkbox-primary rounded-md">
                        <span class="text-xs text-slate-600 dark:text-slate-400 font-medium">Ingat Sesi Login Saya</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmitLogin" class="btn-duotone w-full py-3.5 rounded-xl font-bold text-sm shadow-xl flex items-center justify-center gap-2 mt-2">
                    <span>Masuk Ke Dashboard</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>
        </div>

        <!-- Footer Help -->
        <p class="text-center text-xs text-slate-500">
            Kendala Login? Hubungi <a href="javascript:void(0)" onclick="showInfoModal({ title: 'Kontak Helpdesk Layanan', message: 'Email Resmi: <strong class=\'text-syarat\'>helpdesk@kolab.id</strong><br>WhatsApp Layanan: <strong class=\'text-syarat\'>+62 812-3456-7890</strong><br>Jam Operasional: Setiap Hari (08.00 - 17.00 WIB)', type: 'info' })" class="text-syarat dark:text-syarat-light font-bold hover:underline">Helpdesk Layanan</a>
        </p>

    </main>

    <!-- Popup JS -->
    <script src="js/popup.js"></script>

    <!-- Vanilla JS Logic -->
    <script>
        let selectedRoleState = 'peserta';

        function initTheme() {
            const savedTheme = localStorage.getItem('kolab_theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.setAttribute('data-theme', 'dark');
                const icon = document.getElementById('themeIcon');
                if (icon) icon.className = 'fa-solid fa-sun text-amber-400 text-base';
            } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.setAttribute('data-theme', 'light');
                const icon = document.getElementById('themeIcon');
                if (icon) icon.className = 'fa-solid fa-moon text-slate-700 text-base';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('kolab_theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = isDark ? 'fa-solid fa-sun text-amber-400 text-base' : 'fa-solid fa-moon text-slate-700 text-base';
        }

        function selectRole(role) {
            selectedRoleState = role;
            ['peserta', 'mentor', 'admin'].forEach(r => {
                const btn = document.getElementById(`tabRole_${r}`);
                if (r === role) {
                    btn.className = "py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-gradient-to-r from-syarat to-tigpad text-white shadow-md";
                } else {
                    btn.className = "py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
                }
            });

            const emailInput = document.getElementById('loginEmail');
            const badgeTitle = document.getElementById('roleBadgeTitle');
            const badgeDesc = document.getElementById('roleBadgeDesc');
            const badgeIcon = document.getElementById('roleBadgeIcon');

            if (role === 'peserta') {
                emailInput.value = 'rina.rahmawati@email.com';
                badgeTitle.innerText = "Akses Login Peserta Umum";
                badgeDesc.innerText = "Gunakan email akun terdaftar Anda.";
                badgeIcon.className = "w-8 h-8 rounded-xl bg-syarat text-white flex items-center justify-center font-bold text-sm flex-shrink-0";
                badgeIcon.innerHTML = '<i class="fa-solid fa-graduation-cap"></i>';
            } else if (role === 'mentor') {
                emailInput.value = 'budi.santoso@email.com';
                badgeTitle.innerText = "Akses Login Mentor BISINDO";
                badgeDesc.innerText = "Kredensial khusus pengajar & penguji BISINDO.";
                badgeIcon.className = "w-8 h-8 rounded-xl bg-tigpad text-white flex items-center justify-center font-bold text-sm flex-shrink-0";
                badgeIcon.innerHTML = '<i class="fa-solid fa-chalkboard-user"></i>';
            } else if (role === 'admin') {
                emailInput.value = 'engkus.kuswandi@email.com';
                badgeTitle.innerText = "Akses Login Administrator LMS";
                badgeDesc.innerText = "Hak akses penuh manajemen pengguna & kurikulum.";
                badgeIcon.className = "w-8 h-8 rounded-xl bg-slate-800 text-white flex items-center justify-center font-bold text-sm flex-shrink-0";
                badgeIcon.innerHTML = '<i class="fa-solid fa-user-shield"></i>';
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitLogin');
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> <span>Memverifikasi Akun...</span>';
            btn.disabled = true;

            localStorage.setItem('kolab_role', selectedRoleState);
            
            setTimeout(() => {
                window.location.href = `dashboard.html?role=${selectedRoleState}`;
            }, 600);
        }

        document.addEventListener('DOMContentLoaded', initTheme);
    </script>
</body>
</html>
